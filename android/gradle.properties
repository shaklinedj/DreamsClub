# Optimized Gradle Configuration for Flutter
# JVM arguments: 4GB heap, parallel garbage collector, UTF-8 encoding
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Enable Gradle daemon to keep Gradle in memory between builds (faster)
org.gradle.daemon=true

# Enable parallel execution of tasks
org.gradle.parallel=true

# Maximum number of worker processes (adjust based on CPU cores)
org.gradle.workers.max=2
# Configure projects on demand (only configure necessary projects)
org.gradle.configureondemand=true

# Enable build caching for faster incremental builds
org.gradle.caching=true

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true