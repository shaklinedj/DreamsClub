name: flutter_facebook_reactions
description: A highly customizable Flutter widget that mimics Facebook reaction bar with smooth Lottie animations and sounds.
version: 0.0.1
homepage: https://github.com/hernanlaurel/flutter_facebook_reactions

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.0.0
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/lottie/
    - assets/sounds/
